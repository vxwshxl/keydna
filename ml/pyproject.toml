[project]
name = "keydna-ml"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
